# Render deployment. Secrets marked sync: false are entered in Render's dashboard and are
# never stored in this file.
services:
  - type: web
    name: weeklies
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: weeklies-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_TAB
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: INPUT_SHEET_ID
        sync: false
      - key: INPUT_FORM_URL
        sync: false
      - key: CALENDAR_SYNC
        value: "off"
      - key: CALENDAR_ADMIN_EMAIL
        sync: false
      - key: SHEET_SYNC_MINUTES
        value: "5"
